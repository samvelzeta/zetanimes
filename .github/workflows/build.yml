name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Actualizado a la 20 para evitar advertencias

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets @capacitor/android @capacitor/core @capacitor/cli

      - name: Initialize Capacitor
        run: |
          # Solo inicializa si no existe el config, y añade la plataforma solo si falta
          npx cap init zetanime com.zetanime.app --web-dir . || true
          npx cap add android || echo "La plataforma Android ya existe, saltando paso..."

      - name: Sync Capacitor
        run: npx cap sync android # Esto une tu código web con la carpeta android existente

      - name: Generate Assets (Logos y Splash)
        run: |
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg || echo "Error en assets, continuando..."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
