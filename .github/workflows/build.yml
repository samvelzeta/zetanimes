name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparando Carpetas
        run: |
          mkdir -p www
          rm -rf android

      - name: Instalando Herramientas
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Crear Proyecto Android
        run: |
          npx cap add android

      - name: Configurar Iconos
        run: |
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg

      - name: Inyectar Permisos y Rotacion
        run: |
          # Esto modifica el archivo recién creado para que no se reinicie al girar
          sed -i 's/android:configChanges="orientation|keyboardHidden|screenSize"/android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"/g' android/app/src/main/AndroidManifest.xml
          # Añadimos permisos de cámara (opcional pero lo pediste)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
