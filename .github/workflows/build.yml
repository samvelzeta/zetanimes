name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/core @capacitor/cli

      - name: Build Web Project
        run: |
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/www

      - name: Force Android Project
        run: |
          # Borramos configuraciones viejas para que no den conflicto
          rm -f capacitor.config.json
          npx cap init zetanime com.zetanime.app --web-dir www
          
          # Si ya existe la carpeta android, la borramos para que se cree limpia y con el 'gradlew'
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          # Ahora sí va a encontrar el archivo gradlew porque lo creamos limpio arriba
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
