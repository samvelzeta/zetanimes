name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Usamos la versión más nueva para quitar el aviso amarillo

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets @capacitor/android @capacitor/core @capacitor/cli

      - name: Build Web Project
        run: |
          mkdir -p www
          cp -r * www/ || true
          # Eliminamos la carpeta www de adentro de www para evitar bucles
          rm -rf www/www 

      - name: Fresh Capacitor Setup
        run: |
          # Borramos el config viejo si existe y creamos uno nuevo perfecto
          rm -f capacitor.config.json
          npx cap init zetanime com.zetanime.app --web-dir www
          
          # Si la carpeta android ya existe, solo la sincronizamos
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Assets & Build
        run: |
          # Si los iconos fallan, que siga adelante para que al menos tengas la APK
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg || echo "Saltando assets por error"
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
