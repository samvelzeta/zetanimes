name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalando Herramientas de Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Limpiar y Crear Proyecto Android
        run: |
          # Borramos cualquier rastro de la carpeta android para evitar bucles
          rm -rf android
          
          # Creamos una carpeta vacía para que Capacitor no intente copiarse a sí mismo
          mkdir -p www
          
          # Inicializamos Android de forma limpia
          npx cap add android

      - name: Procesando Iconos y Splash JPG
        run: |
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg

      - name: Aplicando Configuración de Rotación
        run: |
          # Aquí forzamos la configuración de rotación en el archivo nuevo
          sed -i 's/android:configChanges="orientation|keyboardHidden|screenSize"/android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"/g' android/app/src/main/AndroidManifest.xml

      - name: Fabricando APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Entregar APK de zetanime
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
