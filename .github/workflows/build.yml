name: Generar APK zetanime
on: 
  push:
    branches:
      - main
    tags:
      - 'v*' # Esto activa el Release automático cuando creas una etiqueta como v1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/core @capacitor/cli

      - name: Build Web Project
        run: |
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/www

      - name: Force Android Project
        run: |
          rm -f capacitor.config.json
          npx cap init zetanime com.zetanime.app --web-dir www
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # Renombrar el archivo de debug a zetanime.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/zetanime.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/zetanime.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/zetanime.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
