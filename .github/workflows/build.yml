name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets @capacitor/android @capacitor/core @capacitor/cli

      - name: Prepare Web Directory and Fix Config
        run: |
          # 1. Crear carpeta www y copiar todo el contenido
          mkdir -p www
          cp -r * www/ || true
          
          # 2. Forzar que el config use "www" en lugar de "."
          # Esto busca la línea de webDir y la cambia automáticamente
          sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json || echo "Ya estaba corregido"

      - name: Initialize and Sync
        run: |
          npx cap init zetanime com.zetanime.app --web-dir www || true
          npx cap add android || echo "La plataforma ya existe"
          npx cap sync android

      - name: Generate Assets
        run: |
          # Intentamos generar con JPG, si falla saltamos para no detener la APK
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg || echo "Error en assets, se usará el icono por defecto"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
