name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalando Herramientas
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Limpieza Radical y Preparación
        run: |
          # Forzamos la eliminación de cualquier carpeta android que GitHub crea que existe
          rm -rf android
          # Creamos una carpeta de salida que esté FUERA del flujo principal
          mkdir -p .out_www
          # Creamos un archivo capacitor.config.json temporal solo para el build
          echo '{"appId":"com.zetanime.app","appName":"zetAnime","webDir":".out_www","server":{"url":"https://zetanimes.lovable.app","cleartext":true}}' > capacitor.config.json

      - name: Crear Proyecto Android
        run: |
          # Usamos la carpeta vacía para evitar el bucle infinito de copia
          npx cap add android

      - name: Configurar Iconos y Splash
        run: |
          # Si las imágenes no están, este paso se saltará sin romper el build
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg || echo "Imágenes no encontradas, saltando..."

      - name: Inyectar Permisos y Rotación
        run: |
          # Aplicamos el parche de rotación de pantalla
          sed -i 's/android:configChanges="orientation|keyboardHidden|screenSize"/android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"/g' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
