name: Generar APK zetanime
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalando Herramientas
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Crear Proyecto Limpio
        run: |
          # Borramos rastro de android por seguridad
          rm -rf android
          # Agregamos la plataforma
          npx cap add android

      - name: Configurar Iconos y Splash
        run: |
          npx capacitor-assets generate --android --icon-only assets/icon-only.jpg --splash assets/splash.jpg

      - name: Inyectar Permisos y Rotación
        run: |
          # Modificamos el archivo para que el video sea fluido al girar
          sed -i 's/android:configChanges="orientation|keyboardHidden|screenSize"/android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"/g' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: zetanime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
